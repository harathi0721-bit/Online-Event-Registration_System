```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Registration | EventHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            min-height: 100vh;
            padding: 30px 15px;
        }

        header {
            max-width: 750px;
            margin: 0 auto 25px;
            text-align: center;
        }

        header h1 {
            color: #172554;
            margin-bottom: 10px;
        }

        header p {
            color: #475569;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .container h2 {
            text-align: center;
            color: #1d4ed8;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #334155;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus, select:focus, textarea:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        #message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background: #dcfce7;
            color: #166534;
            text-align: center;
            line-height: 1.6;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>EventHub</h1>
        <p>Online Event Registration System</p>
    </header>

    <div class="container">

        <h2>Event Registration Form</h2>

        <form id="registrationForm">

            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your full name"
                       autocomplete="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email"
                       autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter your phone number"
                       autocomplete="tel"
                       pattern="[0-9]{10}"
                       maxlength="10"
                       title="Enter a 10-digit phone number"
                       required>
            </div>

            <div class="form-group">
                <label for="college">College Name *</label>
                <input type="text" id="college" name="college"
                       placeholder="Enter your college name"
                       required>
            </div>

            <div class="form-group">
                <label for="department">Department *</label>
                <select id="department" name="department" required>
                    <option value="">Select Department</option>
                    <option value="CSE">Computer Science Engineering</option>
                    <option value="ECE">Electronics and Communication</option>
                    <option value="EEE">Electrical and Electronics</option>
                    <option value="IT">Information Technology</option>
                    <option value="MECH">Mechanical Engineering</option>
                    <option value="CIVIL">Civil Engineering</option>
                    <option value="OTHER">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="year">Year of Study *</label>
                <select id="year" name="year" required>
                    <option value="">Select Year</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                </select>
            </div>

            <div class="form-group">
                <label for="event">Select Event *</label>
                <select id="event" name="event" required>
                    <option value="">Choose an Event</option>
                    <option value="Technical Symposium">
                        Technical Symposium
                    </option>
                    <option value="Cultural Fest">
                        Cultural Fest
                    </option>
                    <option value="Sports Meet">
                        Sports Meet
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="comments">Additional Information</label>
                <textarea id="comments" name="comments" rows="3"
                          placeholder="Any additional information (optional)"></textarea>
            </div>

            <button type="submit" class="submit-btn">
                Submit Registration
            </button>

        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <a href="index.html" class="back-link">
            ← Back to Home Page
        </a>

    </div>

    <script>
        const form = document.getElementById("registrationForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const studentName =
                document.getElementById("name").value.trim();

            const selectedEvent =
                document.getElementById("event").value;

            const registrationId =
                "EVT-" + Date.now().toString().slice(-8);

            message.style.display = "block";

            message.innerHTML =
                "<strong>Form submitted successfully!</strong><br>" +
                "Thank you, " + escapeHTML(studentName) + ".<br>" +
                "Selected Event: " + escapeHTML(selectedEvent) + "<br>" +
                "Demo Reference ID: " + registrationId +
                "<br><small>This is a demonstration only. " +
                "Your registration has not been saved to a server.</small>";

            form.reset();
        });

        function escapeHTML(value) {
            return value.replace(/[&<>"']/g, function(character) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                }[character];
            });
        }
    </script>

</body>
</html>
